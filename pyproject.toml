[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-idempotency"
version = "0.1.2"
description = "Reliability layer for production AI agents: exactly-once execution, HITL approval gates, per-event billing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cristian Amigo", email = "cstamigo@gmail.com" }]
keywords = ["hitl", "idempotency", "reliability", "agents", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/cstamigo-droid/aegis-idempotency"
Repository = "https://github.com/cstamigo-droid/aegis-idempotency"
"Bug Tracker" = "https://github.com/cstamigo-droid/aegis-idempotency/issues"

[tool.setuptools.packages.find]
include = ["aegis_hitl*"]

[tool.setuptools.package-data]
"aegis_hitl" = ["py.typed"]
